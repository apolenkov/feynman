name: Factory control

on:
  workflow_dispatch:
    inputs:
      command:
        type: choice
        options:
          [
            preflight,
            admit,
            bootstrap,
            register,
            reserve,
            outcome,
            checkpoint,
            recover,
            publication,
            repro,
            push-pr,
            merge,
            closure,
            sweep,
            provider-gate,
            operation-intent,
            operation-outcome,
            retry-claim,
            night-scan,
          ]
        default: preflight
      request:
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: factory-control-v1
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install secretless development tools
        run: npm ci --ignore-scripts
      - name: Independently verify role, public source, release and finite budget
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ACTIVATION_POLICY_PIN: ${{ vars.FACTORY_ACTIVATION_POLICY_PIN }}
          FACTORY_ROLE: ${{ inputs.command == 'bootstrap' && 'bootstrap' || 'repair' }}
          FACTORY_INPUT: ${{ inputs.request }}
        run: |
          printf '%s' '{"output_file":"factory-preflight.json"}' > factory-input.json
          node scripts/factory-control.ts source-preflight factory-input.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          let authorized = false;
          if (fs.existsSync('factory-preflight.json')) authorized = parseFactoryJson(fs.readFileSync('factory-preflight.json')).authorized === true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${authorized}\n`);
          NODE
  recover:
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true' && inputs.command == 'recover'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install secretless development tools
        run: npm ci --ignore-scripts
      - name: Recover exact independent checkpoint and intervening history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ACTIVATION_POLICY_PIN: ${{ vars.FACTORY_ACTIVATION_POLICY_PIN }}
          FACTORY_ROLE: ${{ inputs.command == 'bootstrap' && 'bootstrap' || 'repair' }}
          FACTORY_INPUT: ${{ inputs.request }}
        run: node scripts/factory-control.ts recover
  authority-bootstrap:
    name: factory-authority-bootstrap
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true' && inputs.command == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install secretless development tools
        run: npm ci --ignore-scripts
      - id: prepare
        name: Prepare canonical bootstrap core without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ACTIVATION_POLICY_PIN: ${{ vars.FACTORY_ACTIVATION_POLICY_PIN }}
          FACTORY_ROLE: ${{ inputs.command == 'bootstrap' && 'bootstrap' || 'repair' }}
          FACTORY_INPUT: ${{ inputs.request }}
        run: |
          mkdir -p factory
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const value = parseFactoryJson(process.env.FACTORY_INPUT || '{}');
          fs.writeFileSync('factory-input.json', JSON.stringify({ ...value, output_file: 'factory/receipt.json' }));
          NODE
          node scripts/factory-control.ts bootstrap factory-input.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const core = parseFactoryJson(fs.readFileSync('factory/receipt.json'));
          const transition = core.kind === 'checkpoint' ? fs.readFileSync('factory/checkpoint.json.transition', 'utf8') : core.transition_id;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `transition_id=${transition}\n`);
          NODE
      - name: Upload authority
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-v1-receipt-${{ github.run_id }}-1-${{ steps.prepare.outputs.transition_id }}
          path: factory/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Emit authority
        env:
          FACTORY_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          FACTORY_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/factory-protocol.ts emit factory/receipt.json
  append-bootstrap:
    needs: authority-bootstrap
    # shortcut: unset flag denies; owner enables only after trusted bootstrap.
    if: vars.FACTORY_PRIVILEGED_JOBS_ENABLED == 'true' && (needs.authority-bootstrap.result == 'success')
    runs-on: ubuntu-latest
    environment: factory-privileged
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install secretless development tools
        run: npm ci --ignore-scripts
      - name: Authenticate completed producer and publish one ordinary fast forward
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ACTIVATION_POLICY_PIN: ${{ vars.FACTORY_ACTIVATION_POLICY_PIN }}
          FACTORY_ROLE: ${{ inputs.command == 'bootstrap' && 'bootstrap' || 'repair' }}
          FACTORY_INPUT: ${{ inputs.request }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const value = parseFactoryJson(process.env.FACTORY_INPUT || '{}');
          fs.writeFileSync('factory-input.json', JSON.stringify({ ...value, producer_phase: 'bootstrap', commit_bootstrap: true }));
          NODE
          node scripts/factory-control.ts bootstrap factory-input.json
  authority-register:
    name: factory-authority-register
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true' && inputs.command == 'register'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
