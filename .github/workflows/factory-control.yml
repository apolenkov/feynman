          node scripts/factory-writer.ts "$FACTORY_COMMAND" factory-input.json
  writer:
    needs: preflight
    # shortcut: unset flag denies; owner enables only after trusted bootstrap.
    if: vars.FACTORY_PRIVILEGED_JOBS_ENABLED == 'true' && (needs.preflight.outputs.authorized == 'true' && (inputs.command == 'push-pr' || inputs.command == 'closure' || inputs.command == 'provider-gate' || inputs.command == 'merge' || inputs.command == 'sweep'))
    runs-on: ubuntu-latest
    environment: factory-privileged
    permissions:
