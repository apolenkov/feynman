  authority-checkpoint:
    name: factory-authority-checkpoint
    needs: [preflight, append-bootstrap, append-register, append-reserve, append-outcome]
    if: always() && needs.preflight.outputs.authorized == 'true' && (inputs.command == 'checkpoint' || needs.append-bootstrap.result == 'success' || needs.append-register.result == 'success' || needs.append-reserve.result == 'success' || needs.append-outcome.result == 'success')
