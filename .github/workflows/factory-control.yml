        run: node scripts/factory-protocol.ts emit factory/receipt.json
  append-register:
    needs: authority-register
    # shortcut: unset flag denies; owner enables only after trusted bootstrap.
    if: vars.FACTORY_PRIVILEGED_JOBS_ENABLED == 'true' && (needs.authority-register.result == 'success')
    runs-on: ubuntu-latest
    environment: factory-privileged
    permissions:
