      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install development tools from approved release without credentials
        run: npm ci --ignore-scripts
      - name: Execute fixed release role with authenticated request
        env:
