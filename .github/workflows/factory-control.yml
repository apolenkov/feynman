      - name: Ensure standard archive tooling
        if: runner.os == 'Linux'
        run: |
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libarchive-tools
          fi
      - name: Install secretless development tools
        run: npm ci --ignore-scripts
      - id: prepare
        name: Prepare canonical register core without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ACTIVATION_POLICY_PIN: ${{ vars.FACTORY_ACTIVATION_POLICY_PIN }}
          FACTORY_ROLE: ${{ inputs.command == 'bootstrap' && 'bootstrap' || 'repair' }}
          FACTORY_INPUT: ${{ inputs.request }}
        run: |
          mkdir -p factory
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const value = parseFactoryJson(process.env.FACTORY_INPUT || '{}');
          fs.writeFileSync('factory-input.json', JSON.stringify({ ...value, output_file: 'factory/receipt.json' }));
          NODE
          node scripts/factory-control.ts register factory-input.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const core = parseFactoryJson(fs.readFileSync('factory/receipt.json'));
          const transition = core.kind === 'checkpoint' ? fs.readFileSync('factory/checkpoint.json.transition', 'utf8') : core.transition_id;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `transition_id=${transition}\n`);
          NODE
      - name: Upload authority
