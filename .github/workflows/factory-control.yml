          import fs from 'node:fs';
          import { parseFactoryJson } from './scripts/factory-protocol.ts';
          const value = parseFactoryJson(process.env.FACTORY_INPUT || '{}');
          fs.writeFileSync('factory-input.json', JSON.stringify({ ...value, producer_phase: 'reserve', commit_bootstrap: false }));
