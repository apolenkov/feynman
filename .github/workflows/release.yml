name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run checks and build without publishing to npm'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Release rehearsal
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm for release rehearsal
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Codex CLI for native tests
        run: npm install --global --ignore-scripts @openai/codex@0.153.3
      - name: Run release checks
        run: npm run ci
      - name: Dry-run publish
        run: npm publish "./$(cat dist/TARBALL.txt)" --access public --dry-run --ignore-scripts

  publish:
    name: Build and publish
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_TAG="v${PACKAGE_VERSION}"

          if [ "$EVENT_NAME" = "release" ]; then
            if [ -z "$RELEASE_TAG" ]; then
              echo "Release event is missing its tag name."
              exit 1
            fi
            if [ "$RELEASE_TAG" != "$PACKAGE_TAG" ]; then
              echo "Release tag mismatch: github=${RELEASE_TAG}, package=${PACKAGE_TAG}"
              exit 1
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/${PACKAGE_TAG}"; then
            TAG_COMMIT=$(git rev-parse "refs/tags/${PACKAGE_TAG}^{commit}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Release source mismatch: ${PACKAGE_TAG}=${TAG_COMMIT}, HEAD=${HEAD_COMMIT}"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "release" ]; then
            echo "Release tag is missing from fetched refs: ${PACKAGE_TAG}"
            exit 1
          fi

          echo "Release source validated: ${PACKAGE_TAG} at $(git rev-parse HEAD)"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI for native tests
        run: npm install --global --ignore-scripts @openai/codex@0.153.3

      - name: Run release checks
        run: npm run ci

      - name: Resolve package release metadata
        id: release_metadata
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CURRENT_TAG="v$PACKAGE_VERSION"
          PREVIOUS_TAG=$(git tag --sort=-creatordate --merged "$CURRENT_TAG" 2>/dev/null | awk 'NR==2')
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate --merged HEAD 2>/dev/null | awk 'NR==1')
          fi
          {
            echo "package_name=$PACKAGE_NAME"
            echo "package_version=$PACKAGE_VERSION"
            echo "tag=v$PACKAGE_VERSION"
            echo "current_tag=$CURRENT_TAG"
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog notes
        env:
          VERSION: ${{ steps.release_metadata.outputs.package_version }}
          CURRENT_TAG: ${{ steps.release_metadata.outputs.current_tag }}
          PREVIOUS_TAG: ${{ steps.release_metadata.outputs.previous_tag }}
        run: |
          CHANGELOG_SOURCE="$RUNNER_TEMP/changelog-source.md"

          if git cat-file -e "$CURRENT_TAG:CHANGELOG.md" 2>/dev/null; then
            git show "$CURRENT_TAG:CHANGELOG.md" > "$CHANGELOG_SOURCE"
          else
            cp CHANGELOG.md "$CHANGELOG_SOURCE"
          fi

          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' "$CHANGELOG_SOURCE" > "$RUNNER_TEMP/release-notes.md"

          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            {
              echo "## $VERSION"
              if [ -n "$PREVIOUS_TAG" ]; then
                echo "Changes since ${PREVIOUS_TAG}."
              else
                echo "Changes in $VERSION."
              fi
              echo
              echo "- Release published from package.json version $VERSION."
            } > "$RUNNER_TEMP/release-notes.md"
          fi

          cat "$RUNNER_TEMP/release-notes.md"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: dist/*.tgz
          retention-days: 30

      - name: Check npm version
        id: npm_version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published yet"
          fi

      - name: Update GitHub release notes
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "${TAG#v}" \
              --target "$GITHUB_SHA"
          fi

      - name: Publish to npm via OIDC
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && steps.npm_version.outputs.published != 'true'
        run: npm publish "./$(cat dist/TARBALL.txt)" --access public --ignore-scripts

      - name: Verify npm publish result
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && steps.npm_version.outputs.published != 'true'
        env:
          PACKAGE_NAME: ${{ steps.release_metadata.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release_metadata.outputs.package_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "✅ npm publish verified: ${PACKAGE_NAME}@${PACKAGE_VERSION} is available."
              exit 0
            fi
            echo "⏳ waiting for npm metadata propagation (attempt ${attempt}/5)"
            sleep 5
          done

          echo "❌ npm publish verification failed for ${PACKAGE_NAME}@${PACKAGE_VERSION}."
          exit 1

      - name: Verify release package from npm registry
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          PACKAGE_NAME: ${{ steps.release_metadata.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release_metadata.outputs.package_version }}
        run: |
          npm run test:published
