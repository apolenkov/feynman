name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Supply-chain audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run coverage

      - name: Lint public docs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:docs

      - name: Run eslint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run eslint

      - name: Build npm package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build

      - name: Release smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:release

      - name: Upload package artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          retention-days: 14

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      - name: Check coverage threshold (≥95% lines)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          set -euo pipefail
          # The preceding coverage step already wrote this standard lcov file.
          # Summing LH/LF avoids a second full test run just to read a terminal table.
          COVERAGE=$(awk -F: '
            /^LH:/ { hit += $2 }
            /^LF:/ { found += $2 }
            END {
              if (found == 0) exit 1
              printf "%.2f", (100 * hit / found)
            }
          ' coverage/lcov.info)
          echo "Line coverage: ${COVERAGE}%"
          awk -v cov="${COVERAGE}" 'BEGIN {
            if (cov+0 < 95) {
              print "FAIL: Coverage " cov "% is below 95% threshold"
              exit 1
            } else {
              print "PASS: Coverage " cov "% meets >=95% threshold"
              exit 0
            }
          }'
