# Weekly version updates; a new release waits 3 days before Dependabot
# proposes it (cooldown), so a pulled or compromised version is skipped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # TypeScript 7.0.2 fails strict peer resolution (2026-10-16):
    # typescript-eslint 8.71.2 requires TypeScript <6.1.0; keep compatible 6.0.3.
    ignore:
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    cooldown:
      default-days: 3
    groups:
      tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # Pinned night-scan tool, installed outside the checkout; a bump fails the
  # tool check until policy and lock are reviewed together, so nothing merges itself.
  - package-ecosystem: npm
    directory: /tools/ocr
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    cooldown:
      default-days: 3
    labels:
      - dependencies
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - github-actions
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
