schema: spec-driven

context: |
  Project: feynman — an open-source Codex-only plugin that injects a compact
  Contract at SessionStart and provides a local ASCII Visual linter.

  Canonical sources:
    - Repository conventions → AGENTS.md
    - Domain terms (Structure, Trigger, Visual, Intensity) → CONTEXT.md
    - Ownership and boundaries → docs/architecture.md
    - Decisions and toolchain constraints → docs/adr/
    - Active requirements → openspec/specs/

  `npm run lint` is the product Visual linter; `npm run eslint` is the
  TypeScript linter. Tests use Node's built-in node:test runner. The supported
  runtime is Node.js 22.18 or newer and the published package has zero runtime
  dependencies.

  The supported target is Codex. The native marketplace plugin and npm CLI are
  delivery paths for the same Contract. Planning is OpenSpec; archived change
  records are historical context, not active requirements.

rules:
  proposal:
    - State the user-facing problem and why it matters before proposing a solution.
    - Always include a "Non-goals" section.
  specs:
    - Use domain terms exactly as defined in /CONTEXT.md.
    - Every requirement is a testable "The system SHALL ..." statement with at least one scenario.
  tasks:
    - Break work into small, independently committable steps that keep tests green.
    - Each task names the files it touches.
